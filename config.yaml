# service-watchdog configuration

# Minutes between check rounds
check_interval: 5

# Seconds to wait for each network operation
timeout: 10

# Consecutive failures before a DOWN alert is sent (avoids alerting on blips)
failure_threshold: 2

# Warn when a TLS certificate expires in fewer than this many days
tls_expiry_warning_days: 14

# Every check result is appended here; used by report.py
history_file: logs/history.csv

# Endpoints to monitor. A plain URL works, or a mapping with extra checks.
targets:
  - name: Example
    url: https://example.com
    expected_status: 200
    keyword: "Example Domain"
    max_latency_ms: 2000

  - name: GitHub
    url: https://github.com
    max_latency_ms: 3000

  - https://www.google.com

# SMTP server for alerts (credentials are read from the .env file)
email:
  smtp_server: smtp.gmail.com
  smtp_port: 587
